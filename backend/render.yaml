services:
  - type: web
    name: rexmatch-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false  # 手动填写 CockroachDB 连接串
      - key: REDIS_URL
        sync: false  # 手动填写 Upstash Redis URL
      - key: SECRET_KEY
        generateValue: true
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health
